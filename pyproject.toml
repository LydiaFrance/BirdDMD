[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "BirdDMD"
version = "1.0.0"
description = "Dynamic Mode Decomposition for bird flight analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Lydia France" },
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "pydmd",
    "morphing_birds @ git+https://github.com/LydiaFrance/morphing_birds@kestrels",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "ipympl",
    "plotly",
    "kaleido",
    "seaborn",
    "ipywidgets",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-jupyter>=0.25",
    "mkdocs-section-index>=0.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"notebooks/scripts/**" = ["PLR2004"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/birddmd"]
