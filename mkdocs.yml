site_name: BirdDMD
site_description: Dynamic Mode Decomposition for bird flight analysis
repo_url: https://github.com/LydiaFrance/BirdDMD
repo_name: LydiaFrance/BirdDMD
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
  - section-index

# Exclude archive material and helper scripts from the docs build.
exclude_docs: |
  archive/
  notebooks/scripts/
  notebooks/.DS_Store
  notebooks/02_individuals.ipynb


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API Reference:
      - api/index.md
      - Core: api/core.md
      - Data: api/data.md
      - Reconstruction: api/reconstruction.md
      - Stats: api/stats.md
      - Plotting: api/plotting.md
      - Hawk: api/hawk.md
      - Constants: api/constants.md
  - Notebook Gallery:
      - notebooks/index.md
      - Introduction: notebooks/00_introduction.ipynb
      - Flapping Modes: notebooks/01_flapping_modes.ipynb
      # - Individuals: notebooks/02_individuals.ipynb
      - Double Frequency: notebooks/03_double_frequency.ipynb
      - Full Flight: notebooks/04_full_flight.ipynb
      - Turning: notebooks/05_turning.ipynb
      - Reconstruction Accuracy: notebooks/06_reconstruction_accuracy.ipynb
      - Generative Model: notebooks/07_generative_model.ipynb
